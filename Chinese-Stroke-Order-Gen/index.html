<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chinese-stroke-order-generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        body.preview-mode {
            background: #87CEEB;
        }
        #canvas-container {
            width: 500px;
            height: 500px;
            position: relative;
        }
        .grid-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.28);
            pointer-events: none;
            display: none;
        }
        body.preview-mode .grid-line {
            display: block;
        }
        .grid-line.horizontal {
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        .grid-line.vertical {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        .grid-line.diagonal {
            top: 50%;
            left: 50%;
            width: 141.5%;
            height: 2px;
            transform-origin: center;
        }
        .grid-line.diagonal-a {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .grid-line.diagonal-b {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .grid-border {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.32);
            pointer-events: none;
            display: none;
        }
        body.preview-mode .grid-border {
            display: block;
        }
        #character-container {
            width: 500px;
            height: 500px;
            position: relative;
        }

    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="grid-border"></div>
        <div class="grid-line horizontal"></div>
        <div class="grid-line vertical"></div>
        <div class="grid-line diagonal diagonal-a"></div>
        <div class="grid-line diagonal diagonal-b"></div>
        <div id="character-container"></div>

    </div>
    <script src="/node_modules/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const character = urlParams.get('char') || '中';
        const mode = urlParams.get('mode') || 'transparent';

        if (mode === 'preview') {
            document.body.classList.add('preview-mode');
        }

        window.writer = null;
        window.loadError = null;
        window.animationReady = false;

        window.renderProgress = function(strokeIndex, portion) {
            if (!window.writer || !window.writer._renderState || !window.writer._character) return;
            const totalStrokes = window.writer._character.strokes.length;
            const strokeStates = {};
            for (let i = 0; i < totalStrokes; i++) {
                if (i < strokeIndex) {
                    strokeStates[i] = { opacity: 1, displayPortion: 1 };
                } else if (i === strokeIndex) {
                    strokeStates[i] = { 
                        opacity: portion > 0.001 ? 1 : 0, 
                        displayPortion: Math.max(0, Math.min(1, portion)) 
                    };
                } else {
                    strokeStates[i] = { opacity: 0, displayPortion: 0 };
                }
            }
            window.writer._renderState.updateState({
                character: {
                    main: {
                        opacity: 1,
                        strokes: strokeStates
                    }
                }
            });
        };

        function initHanziWriter(charData) {
            try {
                const options = {
                    width: 500,
                    height: 500,
                    padding: 30,
                    strokeColor: '#800020', // Bordeaux Red
                    strokeWidth: 5,
                    showCharacter: false,
                    showOutline: false,
                    delayBetweenStrokes: 0,
                    delayBetweenLoops: 0,
                    radicalColor: '#800020'
                };
                if (charData) {
                    options.charDataLoader = (char, onComplete) => onComplete(charData);
                }
                const writer = HanziWriter.create('character-container', character, options);
                window.writer = writer;
                window.animationReady = true;
            } catch (err) {
                console.error('Error creating HanziWriter:', err);
                window.loadError = err.message || 'Error creating HanziWriter';
                window.animationReady = true;
            }
        }

        if (window.__INITIAL_CHAR_DATA__) {
            initHanziWriter(window.__INITIAL_CHAR_DATA__);
        } else {
            HanziWriter.loadCharacterData(character).then(function(data) {
                initHanziWriter(data);
            }).catch(function(err) {
                console.error('Error loading character data:', err);
                window.loadError = err.message || 'Error loading character';
                window.animationReady = true;
            });
        }
    </script>
</body>
</html>
