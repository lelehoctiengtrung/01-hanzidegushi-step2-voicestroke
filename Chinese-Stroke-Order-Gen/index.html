<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chinese-stroke-order-generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #character-container {
            width: 500px;
            height: 500px;
            position: relative;
        }
    </style>
    <script src="/node_modules/hanzi-writer/dist/hanzi-writer.min.js"></script>
</head>
<body>
    <div id="character-container"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const character = urlParams.get('char') || '中';

        window.writer = null;
        window.loadError = null;
        window.animationReady = false;
        window.animationFinished = false;

        let currentTime = 1000;
        let rafCallbacks = [];
        let timeouts = [];
        let nextId = 1;

        window.advanceTime = function(ms) {
            currentTime += ms;

            // Run due timeouts
            const dueTimeouts = timeouts.filter(t => t.triggerTime <= currentTime);
            timeouts = timeouts.filter(t => t.triggerTime > currentTime);
            dueTimeouts.sort((a, b) => a.triggerTime - b.triggerTime);
            for (let t of dueTimeouts) {
                try { t.cb(); } catch (e) { console.error('Timeout error:', e); }
            }

            // Run RAF callbacks
            const currentRafs = rafCallbacks;
            rafCallbacks = [];
            for (let r of currentRafs) {
                try { r.cb(currentTime); } catch (e) { console.error('RAF error:', e); }
            }
        };

        window.startCapture = function() {
            // Hijack time APIs for deterministic virtual clock
            window.performance.now = () => currentTime;
            Date.now = () => currentTime;

            window.requestAnimationFrame = function(cb) {
                const id = ++nextId;
                rafCallbacks.push({ id, cb });
                return id;
            };
            window.cancelAnimationFrame = function(id) {
                rafCallbacks = rafCallbacks.filter(r => r.id !== id);
            };

            window.setTimeout = function(cb, delay) {
                const id = ++nextId;
                timeouts.push({ id, cb, triggerTime: currentTime + (delay || 0) });
                return id;
            };
            window.clearTimeout = function(id) {
                timeouts = timeouts.filter(t => t.id !== id);
            };

            if (!window.writer) return;

            window.writer.animateCharacter({
                onComplete: function() {
                    console.log('HanziWriter native animation finished!');
                    window.animationFinished = true;
                }
            });
        };

        function initHanziWriter(charData) {
            try {
                const options = {
                    width: 500,
                    height: 500,
                    padding: 30,
                    strokeColor: '#800020', // Solid Bordeaux Red
                    strokeWidth: 5,
                    showCharacter: false,
                    showOutline: false,
                    strokeAnimationSpeed: 1.0,
                    delayBetweenStrokes: 120,
                    radicalColor: '#800020'
                };
                if (charData) {
                    options.charDataLoader = (char, onComplete) => onComplete(charData);
                }
                const writer = HanziWriter.create('character-container', character, options);
                window.writer = writer;

                if (writer._withDataPromise) {
                    writer._withDataPromise.then(function() {
                        console.log('HanziWriter character ready!');
                        window.animationReady = true;
                    }).catch(function(err) {
                        console.error('HanziWriter error:', err);
                        window.loadError = (err && err.message) || String(err);
                        window.animationReady = true;
                    });
                } else {
                    window.animationReady = true;
                }
            } catch (err) {
                console.error('Error creating HanziWriter:', err);
                window.loadError = err.message || 'Error creating HanziWriter';
                window.animationReady = true;
            }
        }

        if (window.__INITIAL_CHAR_DATA__) {
            initHanziWriter(window.__INITIAL_CHAR_DATA__);
        } else {
            HanziWriter.loadCharacterData(character).then(function(data) {
                initHanziWriter(data);
            }).catch(function(err) {
                console.error('Error loading character data:', err);
                window.loadError = err.message || 'Error loading character';
                window.animationReady = true;
            });
        }
    </script>
</body>
</html>
