<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Stroke Order Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #canvas-container {
            width: 500px;
            height: 500px;
            position: relative;
            background: transparent !important;
        }
        #character-container {
            width: 500px;
            height: 500px;
            position: relative;
            background: transparent !important;
        }
        svg {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="character-container"></div>
    </div>
    <script src="/node_modules/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const character = urlParams.get('char') || '门';
        
        const RAINBOW_PALETTE = [
            '#E63946', '#F4A261', '#2A9D8F', '#457B9D',
            '#9B5DE5', '#F15BB5', '#00BBF9', '#00F5D4',
            '#DDA15E', '#BC6C25', '#E76F51', '#264653'
        ];
        const BORDEAUX_RED = '#800020';

        const writer = HanziWriter.create('character-container', character, {
            width: 500,
            height: 500,
            padding: 20,
            strokeColor: '#E63946',
            strokeWidth: 6,
            showCharacter: false,
            showOutline: false,
            delayBetweenStrokes: 300,
            strokeAnimationDuration: 800
        });

        window.writer = writer;
        window.animationReady = false;
        window.animationStarted = false;
        window.animationComplete = false;

        async function startMultiColorAnimation() {
            window.animationStarted = true;
            try {
                // Get character stroke count
                const charData = await HanziWriter.loadCharacterData(character);
                const strokeCount = charData.strokes.length;

                // Animate each stroke with its distinct rainbow color
                for (let i = 0; i < strokeCount; i++) {
                    const color = RAINBOW_PALETTE[i % RAINBOW_PALETTE.length];
                    
                    // Set current stroke color before animating
                    await writer.animateStroke(i, {
                        strokeColor: color
                    });
                    
                    // Style the rendered SVG stroke path to persist its multi-color
                    const svg = document.querySelector('#character-container svg');
                    if (svg) {
                        const paths = svg.querySelectorAll('path');
                        if (paths[i]) {
                            paths[i].setAttribute('stroke', color);
                            paths[i].style.stroke = color;
                        }
                    }
                    await new Promise(r => setTimeout(r, 200));
                }

                // Brief pause after all strokes are drawn
                await new Promise(r => setTimeout(r, 400));

                // Turn all strokes into Bordeaux Red (#800020)
                const svg = document.querySelector('#character-container svg');
                if (svg) {
                    const paths = svg.querySelectorAll('path');
                    paths.forEach(p => {
                        p.setAttribute('stroke', BORDEAUX_RED);
                        p.style.stroke = BORDEAUX_RED;
                    });
                }
                await writer.updateColor('strokeColor', BORDEAUX_RED);

                // Hold final Bordeaux Red state for 1.2 seconds
                await new Promise(r => setTimeout(r, 1200));
                window.animationComplete = true;
            } catch (err) {
                console.error('Animation error:', err);
                // Fallback standard animation
                await writer.animateCharacter();
                await writer.updateColor('strokeColor', BORDEAUX_RED);
                window.animationComplete = true;
            }
        }

        window.startMultiColorAnimation = startMultiColorAnimation;

        setTimeout(() => {
            window.animationReady = true;
        }, 600);
    </script>
</body>
</html>
