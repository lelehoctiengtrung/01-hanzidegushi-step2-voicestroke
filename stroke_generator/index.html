<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chinese-stroke-order-generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #87CEEB; /* 浅蓝色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #canvas-container {
            width: 500px;
            height: 500px;
            position: relative;
        }
        .grid-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.28);
            pointer-events: none;
        }
        .grid-line.horizontal {
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        .grid-line.vertical {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        .grid-line.diagonal {
            top: 50%;
            left: 50%;
            width: 141.5%;
            height: 2px;
            transform-origin: center;
        }
        .grid-line.diagonal-a {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .grid-line.diagonal-b {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .grid-border {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.32);
            pointer-events: none;
        }
        #character-container {
            width: 500px;
            height: 500px;
            position: relative;
        }

    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="grid-border"></div>
        <div class="grid-line horizontal"></div>
        <div class="grid-line vertical"></div>
        <div class="grid-line diagonal diagonal-a"></div>
        <div class="grid-line diagonal diagonal-b"></div>
        <div id="character-container"></div>

    </div>
    <script src="/node_modules/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script>
        // 从URL参数获取汉字
        const urlParams = new URLSearchParams(window.location.search);
        const character = urlParams.get('char') || '中';
        
        const writer = HanziWriter.create('character-container', character, {
            width: 500,
            height: 500,
            padding: 10,
            strokeColor: '#FFFFFF', // 白色字符
            strokeWidth: 5, // 增加笔画宽度以适应更大的尺寸
            showCharacter: false,
            showOutline: false,
            delayBetweenStrokes: 400, // 笔画之间的延迟，让动画更慢
            delayBetweenLoops: 0,
            strokeAnimationDuration: 1200, // 每个笔画的动画时长，让动画更慢
            radicalColor: '#FF0000' // 红色笔画高亮
        });
        
        // 暴露writer对象供外部访问
        window.writer = writer;
        window.loadError = null;

        // 用于通知外部动画已准备好
        window.animationReady = false;
        window.animationStarted = false;
        window.animationProgress = 0;
        
        // hanzi-writer的create方法已经加载了字符，等待一小段时间确保渲染完成
        setTimeout(() => {
            window.animationReady = true;
        }, 800);
    </script>
</body>
</html>
