<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Stroke Order Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #canvas-container, #character-container, svg {
            width: 500px;
            height: 500px;
            position: relative;
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="character-container"></div>
    </div>
    <script src="/node_modules/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const character = urlParams.get('char') || '门';
        
        const RAINBOW_PALETTE = [
            '#E63946', '#F4A261', '#2A9D8F', '#457B9D',
            '#9B5DE5', '#F15BB5', '#00BBF9', '#00F5D4',
            '#DDA15E', '#BC6C25', '#E76F51', '#264653'
        ];
        const BORDEAUX_RED = '#800020';

        const writer = HanziWriter.create('character-container', character, {
            width: 500,
            height: 500,
            padding: 20,
            strokeColor: '#E63946',
            strokeWidth: 6,
            showCharacter: false,
            showOutline: false,
            delayBetweenStrokes: 350,
            strokeAnimationDuration: 900
        });

        window.writer = writer;
        window.animationReady = false;
        window.animationComplete = false;

        async function runAnimation() {
            try {
                let charData = null;
                try {
                    charData = await HanziWriter.loadCharacterData(character);
                } catch(e) {
                    charData = writer._character;
                }
                const strokeCount = charData && charData.strokes ? charData.strokes.length : 3;

                for (let i = 0; i < strokeCount; i++) {
                    const color = RAINBOW_PALETTE[i % RAINBOW_PALETTE.length];
                    await writer.animateStroke(i, { strokeColor: color });
                    await new Promise(r => setTimeout(r, 250));
                }

                await new Promise(r => setTimeout(r, 400));
                const paths = document.querySelectorAll('#character-container svg path');
                paths.forEach(p => {
                    p.setAttribute('stroke', BORDEAUX_RED);
                    p.style.stroke = BORDEAUX_RED;
                });
                await new Promise(r => setTimeout(r, 1200));
                window.animationComplete = true;
            } catch (err) {
                console.error('Animation error:', err);
                await writer.animateCharacter();
                const paths = document.querySelectorAll('#character-container svg path');
                paths.forEach(p => {
                    p.setAttribute('stroke', BORDEAUX_RED);
                    p.style.stroke = BORDEAUX_RED;
                });
                await new Promise(r => setTimeout(r, 1000));
                window.animationComplete = true;
            }
        }

        window.runAnimation = runAnimation;
        setTimeout(() => { window.animationReady = true; }, 800);
    </script>
</body>
</html>
