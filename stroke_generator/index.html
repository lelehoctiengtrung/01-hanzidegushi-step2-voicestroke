<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Stroke Order Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #canvas-container, #character-container {
            width: 500px;
            height: 500px;
            position: relative;
            background: transparent !important;
        }
        svg {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="character-container"></div>
    </div>
    <script src="/node_modules/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const character = urlParams.get('char') || '门';
        const BORDEAUX_RED = '#800020';

        const writer = HanziWriter.create('character-container', character, {
            width: 500,
            height: 500,
            padding: 20,
            strokeColor: BORDEAUX_RED,
            strokeWidth: 6,
            showCharacter: false,
            showOutline: false,
            delayBetweenStrokes: 300,
            strokeAnimationDuration: 750
        });

        window.writer = writer;
        window.animationReady = false;
        window.animationComplete = false;

        async function startStrokeAnimation() {
            window.animationComplete = false;
            try {
                await writer.animateCharacter();
                // Hold solid Bordeaux Red completed state for 1.2s
                await new Promise(r => setTimeout(r, 1200));
                window.animationComplete = true;
            } catch (err) {
                console.error('Animation error:', err);
                window.animationComplete = true;
            }
        }

        window.startStrokeAnimation = startStrokeAnimation;
        setTimeout(() => { window.animationReady = true; }, 800);
    </script>
</body>
</html>
