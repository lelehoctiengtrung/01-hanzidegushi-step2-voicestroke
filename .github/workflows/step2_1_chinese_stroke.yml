name: "Step 2.1: Chinese Stroke (Hanzi De Gushi)"

on:
  workflow_dispatch:
    inputs:
      row:
        description: "Số hàng cụ thể (ví dụ: 226)"
        required: false
        default: ""
      start_row:
        description: "Hàng bắt đầu (ví dụ: 226)"
        required: false
        default: ""
      end_row:
        description: "Hàng kết thúc (ví dụ: 234)"
        required: false
        default: ""
      character:
        description: "Chữ Hán cụ thể (ví dụ: '门')"
        required: false
        default: ""
  repository_dispatch:
    types: [trigger_hanzidegushi_step2_1]

jobs:
  stroke_generation:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Install System Dependencies (FFmpeg, libsndfile)"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: "Cache Chinese-Stroke-Order-Gen Dependencies"
        uses: actions/cache@v4
        with:
          path: |
            Chinese-Stroke-Order-Gen/node_modules
            stroke_generator/node_modules
            ~/.npm
            ~/.cache/puppeteer
          key: ${{ runner.os }}-stroke-gen-v2
          restore-keys: |
            ${{ runner.os }}-stroke-gen-

      - name: "Install Stroke Generator NPM Dependencies"
        run: |
          if [ -d "Chinese-Stroke-Order-Gen" ]; then
            cd Chinese-Stroke-Order-Gen
            npm install
            npx puppeteer browsers install chrome
            cd ..
          fi
          if [ -d "stroke_generator" ]; then
            cd stroke_generator
            npm install
            npx puppeteer browsers install chrome
            cd ..
          fi

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Step 2.1 Chinese Stroke Runner"
        env:
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_BASE64 }}
          USER_OAUTH2_BASE64: ${{ secrets.USER_OAUTH2_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.row }}" ]; then
            ARGS="$ARGS --row ${{ github.event.inputs.row }}"
          fi
          if [ -n "${{ github.event.inputs.start_row }}" ]; then
            ARGS="$ARGS --start-row ${{ github.event.inputs.start_row }}"
          fi
          if [ -n "${{ github.event.inputs.end_row }}" ]; then
            ARGS="$ARGS --end-row ${{ github.event.inputs.end_row }}"
          fi
          if [ -n "${{ github.event.inputs.character }}" ]; then
            ARGS="$ARGS --character ${{ github.event.inputs.character }}"
          fi
          python src/step2_1_stroke_runner.py $ARGS
