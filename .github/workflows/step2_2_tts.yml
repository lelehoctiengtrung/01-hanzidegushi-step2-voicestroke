name: "Step 2.2: TTS Voice Generation (Hanzi De Gushi)"

on:
  workflow_dispatch:
    inputs:
      row:
        description: "Số hàng cụ thể cần chạy (ví dụ: 226)"
        required: false
        default: ""
      character:
        description: "Chữ Hán cụ thể cần chạy (ví dụ: '门')"
        required: false
        default: ""
  repository_dispatch:
    types: [trigger_hanzidegushi_step2_2]

jobs:
  tts_voice_generation:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install System Dependencies (libsndfile)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/k2-fsa/OmniVoice.git

      - name: "Cache OmniVoice Model & Edge TTS"
        uses: actions/cache@v4
        with:
          path: |
            assets/omnivoice_cache
            ~/.cache/huggingface
            ~/.cache/edge_tts
          key: ${{ runner.os }}-omnivoice-tts-v1
          restore-keys: |
            ${{ runner.os }}-omnivoice-tts-

      - name: "Execute Step 2.2 TTS Voice Runner"
        env:
          PYTHONPATH: .
          GCP_SERVICE_ACCOUNT_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_BASE64 }}
          USER_OAUTH2_BASE64: ${{ secrets.USER_OAUTH2_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          ROW_ARG=""
          if [ -n "${{ github.event.inputs.row }}" ]; then
            ROW_ARG="--row ${{ github.event.inputs.row }}"
          fi
          CHAR_ARG=""
          if [ -n "${{ github.event.inputs.character }}" ]; then
            CHAR_ARG="--character ${{ github.event.inputs.character }}"
          fi
          python src/step2_2_tts_runner.py $ROW_ARG $CHAR_ARG
